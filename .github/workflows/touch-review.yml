name: Touch Plan A review

on:
  push:
    branches: [review/touch-a]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor-keyboard
            ref: 865e5f4941e2c93880943883e0fbfeffb052d9ee
          - name: preview-selection
            ref: 9e4574fa8c8811fe15023edf08ba76658aedb9f1
          - name: help-panel
            ref: 212d4402d2b1c503b52d7384d57a1739fd77955a
          - name: table-action-priority
            ref: ec0f5953c0c370ddefde02e3353d2661668fe8f1
          - name: combined
            ref: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || github.sha }}
          persist-credentials: false
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CFLAGS: /MP
          CXXFLAGS: /MP
      - name: Build app and input regression harnesses
        run: cmake --build build --config Release --parallel --target tinta input_tests keymap_tests context_menu_tests i18n_tests
      - name: Input regression tests
        run: ctest --test-dir build -C Release --output-on-failure -R '^(keymap|context_menu|input_shortcuts|editor_features|editor_context_selection|wrapped_cursor_navigation|edit_preview_scroll_sync|search_input_focus|table_and_modifier_input|docked_preview_and_hints|window_drag_and_title_space|contents_and_panel_resize|split_scrollbars|editor_drag_move|touch_gestures|search_results_panel|file_fragment_navigation|i18n)$'
      - name: Test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touch-a-${{ matrix.name }}-logs
          path: build/Testing/Temporary/
          retention-days: 14
      - name: Portable review build
        uses: actions/upload-artifact@v4
        with:
          name: touch-a-${{ matrix.name }}-windows
          path: |
            build/Release/tinta.exe
            tests/fixtures/touch-gestures-286.md
          retention-days: 14
